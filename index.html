<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>旅行分帳 WeimaSplit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2f4833" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

  <header class="app-header">
    <div class="brand">
      <span class="logo">🌿</span>
      <h1>旅行分帳</h1>
    </div>
    <div class="trip-selector">
      <label>目前旅程：</label>
      <select id="currentTrip"></select>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="trips" class="active">旅程</button>
    <button data-tab="fx">換匯</button>
    <button data-tab="expenses">記帳</button>
    <button data-tab="analytics">圖表分析</button>
  </nav>

  <main>

    <!-- ======== 旅程 ======== -->
    <section id="tab-trips" class="tab active">
      <div class="card">
        <h3>新增旅程</h3>
        <div class="grid">
          <div>
            <label>旅程名稱</label>
            <input id="trip-name" placeholder="例如：2026 日本賞櫻" />
          </div>
          <div>
            <label>常用幣別（可多個，用逗號）</label>
            <input id="trip-base" placeholder="SGD, JPY" />
          </div>
          <div>
            <label>開始日期</label>
            <input id="trip-start" type="date" />
          </div>
          <div>
            <label>結束日期</label>
            <input id="trip-end" type="date" />
          </div>
        </div>

        <div class="grid">
          <div>
            <label>參與者（用逗號）</label>
            <input id="trip-members" placeholder="Eva, 維, 馬" />
          </div>
        </div>

        <button class="primary full" id="btn-add-trip">新增旅程</button>
      </div>

      <div class="card">
        <h3>旅程列表</h3>
        <table class="table" id="trip-table">
          <thead>
            <tr><th>名稱</th><th>日期</th><th>幣別</th><th>成員</th><th>編輯</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ======== 換匯 ======== -->
    <section id="tab-fx" class="tab">
      <div class="card">
        <h3>新增換匯</h3>

        <div class="grid">
          <div>
            <label>換匯日期</label>
            <input id="fx-date" type="date" />
          </div>
          <div>
            <label>換匯所</label>
            <input id="fx-vendor" placeholder="銀行/換匯所" />
          </div>
          <div>
            <label>幣別</label>
            <input id="fx-currency" placeholder="JPY, SGD..." />
          </div>
          <div>
            <label>1 外幣 = ? TWD</label>
            <input id="fx-rate" type="number" step="0.0001" />
          </div>
          <div>
            <label>外幣金額</label>
            <input id="fx-amt" type="number" step="0.01" />
          </div>
          <div>
            <label>From</label>
            <input id="fx-from" placeholder="ATM/現金/卡片" />
          </div>
        </div>

        <div>
          <label>備註</label>
          <input id="fx-note" />
        </div>

        <button class="primary full" id="btn-add-fx">新增換匯</button>
      </div>

      <div class="card">
        <h3>換匯清單</h3>
        <table class="table" id="fx-table">
          <thead>
            <tr>
              <th>日</th><th>幣別</th><th>匯率</th><th>外幣</th>
              <th>TWD</th><th>換匯所</th><th>From</th><th>備註</th><th>編輯</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ======== 記帳 ======== -->
    <section id="tab-expenses" class="tab">

      <div class="card">
        <h3>新增/編輯支出</h3>

        <div class="grid">
          <div>
            <label>日期</label>
            <input id="exp-date" type="date" />
          </div>

          <div>
            <label>項目</label>
            <select id="exp-category">
              <option>機票</option><option>住宿</option><option>交通</option>
              <option>飲食(餐)</option><option>零食點心飲料</option>
              <option>玩樂</option><option>團費</option>
              <option>紀念品(禮用品)</option><option>紀念品(食品類)</option>
              <option>電信</option><option>郵票</option><option>明信片</option>
              <option>保險</option><option>治裝</option><option>其他</option>
            </select>
          </div>

          <div>
            <label>金額</label>
            <input id="exp-amount" type="number" step="0.01" />
          </div>

          <div>
            <label>幣別</label>
            <select id="exp-currency"></select>
          </div>

          <div>
            <label>TWD 金額（自動換算）</label>
            <input id="exp-amount-twd" readonly />
          </div>

          <div>
            <label>付款方式</label>
            <select id="exp-paymethod">
              <option>現金</option>
              <option>信用卡</option>
              <option>電子支付</option>
              <option>轉帳</option>
            </select>
          </div>
        </div>

        <div class="grid">
          <div>
            <label>付款者（可多選）</label>
            <select id="exp-payers" multiple size="4"></select>
          </div>
          <div>
            <label>費用參與者（可多選）</label>
            <select id="exp-participants" multiple size="4"></select>
          </div>
        </div>

        <div class="grid">
          <div>
            <label>分攤方式</label>
            <select id="exp-splitmethod">
              <option value="equal">平分</option>
              <option value="amount">固定金額</option>
              <option value="percent">百分比</option>
            </select>
          </div>
          <div>
            <label>分攤值（逗號隔開）</label>
            <input id="exp-splitvalues" placeholder="例：200, 300 或 50,50" />
          </div>
        </div>

        <div>
          <label>備註</label>
          <input id="exp-note" />
        </div>

        <button class="primary full" id="btn-add-expense">新增支出</button>
      </div>

      <div class="card">
        <h3>支出清單（可編輯）</h3>

        <table class="table" id="exp-table">
          <thead>
            <tr>
              <th>日</th><th>類別</th><th>金額</th><th>幣別</th>
              <th>TWD</th><th>付款者</th><th>參與者</th>
              <th>分攤方式</th><th>備註</th><th>編輯</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </section>

    <!-- ======== 圖表分析 ======== -->
    <section id="tab-analytics" class="tab">
      <div class="card">
        <h3>依項目類別（圓餅圖）</h3>
        <canvas id="chart-pie" height="200"></canvas>
      </div>

      <div class="card">
        <h3>每位成員每日（群組長條圖）</h3>
        <canvas id="chart-grouped" height="220"></canvas>
      </div>

      <div class="card">
        <h3>每日共同花費（折線圖）</h3>
        <canvas id="chart-line" height="200"></canvas>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    © 2026 WeimaSplit
  </footer>

  <!-- Scripts -->
  <script src="./api.js"></script>
  <script src="./charts.js"></script>
  <script src="./app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
