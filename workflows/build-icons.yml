name: Build PWA Icons
on:
  push:
    paths:
      - 'icons.svg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rsvg-convert
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate PNGs
        run: |
          mkdir -p icons
          rsvg-convert -w 192 -h 192 icons/icon-source.svg > icons/icon-192.png
          rsvg-convert -w 512 -h 512 icons/icon-source.svg > icons/icon-512.png
      - name: Commit icons
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add icons/icon-192.png icons/icon-512.png
          git commit -m "Generate PWA icons from SVG" || echo "No changes"
          git push
